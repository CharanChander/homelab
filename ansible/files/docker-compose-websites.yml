# docker-compose-websites.yml
services:

  # ── Portfolio – pure static ──────────────────────────────────────────────
  nginx-charanchander:
    image: nginx:alpine
    container_name: nginx-charanchander
    restart: unless-stopped
    volumes:
      - ./sites/charanchander.be:/usr/share/nginx/html:ro
    expose:
      - 80
    environment:
      - TZ=Europe/Brussels
    security_opt:
      - no-new-privileges:true

  # ── CC-IT – php-fpm backend ──────────────────────────────────────────────
  php-cc-it:
    image: php:8.2-fpm-alpine
    container_name: php-cc-it
    restart: unless-stopped
    volumes:
      - ./sites/cc-it-solutions.be:/var/www/html
    environment:
      - TZ=Europe/Brussels
    security_opt:
      - no-new-privileges:true

  nginx-cc-it:
    image: nginx:alpine
    container_name: nginx-cc-it
    restart: unless-stopped
    volumes:
      - ./sites/cc-it-solutions.be:/var/www/html:ro
      - ./nginx-cc-it.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - 80
    depends_on:
      - php-cc-it
    environment:
      - TZ=Europe/Brussels
    security_opt:
      - no-new-privileges:true

  # ── Infrastructure ───────────────────────────────────────────────────────
  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer_websites_agent
    restart: unless-stopped
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      - TZ=Europe/Brussels
    security_opt:
      - no-new-privileges:true

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Brussels
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_CLEANUP=true
    security_opt:
      - no-new-privileges:true

  cloudflare-tunnel-cc-it:
    image: cloudflare/cloudflared:latest
    container_name: tunnel-cc-it
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_CC_IT}
    environment:
      - TZ=Europe/Brussels
    security_opt:
      - no-new-privileges:true

  cloudflare-tunnel-portfolio:
    image: cloudflare/cloudflared:latest
    container_name: tunnel-portfolio
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_PORTFOLIO}
    environment:
      - TZ=Europe/Brussels
    security_opt:
      - no-new-privileges:true
