# site.yml
---
- name: Update all packages
  hosts: all
  become: true
  tasks:
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        name: '*'
        state: latest
        update_cache: true

- name: Install UFW and configure firewall
  hosts: all
  become: true
  tasks:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow host-specific ports
      community.general.ufw:
        rule: allow
        port: "{{ item.split('/')[0] }}"
        proto: "{{ item.split('/')[1] }}"
      loop: "{{ ufw_allow_ports | default([]) }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

- name: Install Docker
  hosts: all
  roles:
    - geerlingguy.docker

- name: Add user to docker group
  hosts: all
  become: true
  tasks:
    - name: Add bigchacha to docker group
      ansible.builtin.user:
        name: bigchacha
        groups: docker
        append: true

- name: Increase UDP buffer for cloudflared
  hosts: websites, monitoring
  become: true
  tasks:
    - name: Set UDP buffer sizes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_set: true
      loop:
        - { name: net.core.rmem_max, value: "7340032" }
        - { name: net.core.wmem_max, value: "7340032" }

- name: Copy docker compose files and site assets
  hosts: all
  become: true
  tasks:
    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "files/docker-compose-{{ inventory_hostname }}.yml"
        dest: /home/bigchacha/docker-compose.yml
        owner: bigchacha
        group: bigchacha
        mode: '0644'

    - name: Copy .env file (per host)
      ansible.builtin.copy:
        src: "files/.env.{{ inventory_hostname }}"
        dest: /home/bigchacha/.env
        owner: bigchacha
        group: bigchacha
        mode: '0600'

    - name: Copy nginx config for cc-it (websites only)
      ansible.builtin.copy:
        src: files/nginx-cc-it.conf
        dest: /home/bigchacha/nginx-cc-it.conf
        owner: bigchacha
        group: bigchacha
        mode: '0644'
      when: inventory_hostname == 'websites'

    - name: Copy site files for websites host
      ansible.builtin.copy:
        src: "files/sites/"
        dest: /home/bigchacha/sites/
        owner: bigchacha
        group: bigchacha
        mode: '0644'
        directory_mode: '0755'
      when: inventory_hostname == 'websites'

- name: Execute docker compose
  hosts: all
  become: true
  tasks:
    - name: Check if Docker is running
      ansible.builtin.service_facts:
      register: service_state

    - name: Verify Docker service is running
      ansible.builtin.assert:
        that:
          - "'docker.service' in service_state.ansible_facts.services"
          - "service_state.ansible_facts.services['docker.service'].state == 'running'"

    - name: Execute docker compose up
      community.docker.docker_compose_v2:
        project_src: /home/bigchacha
        files:
          - docker-compose.yml
