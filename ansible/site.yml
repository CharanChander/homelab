# site.yml
---
- name: Update all packages
  hosts: all
  become: true
  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

- name: Enable automatic updates
  hosts: all
  become: true
  tasks:
    - name: Ensure unattended-upgrades is installed
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: '0644'

- name: Install docker
  hosts: all
  become: true
  vars:
    docker_users:
      - "{{ ansible_user }}"
  pre_tasks:
    - name: Ensure gnupg is installed
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true
  roles:
    - geerlingguy.docker

- name: Copy docker compose file
  hosts: all
  become: true
  tasks:
    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: "files/templates/docker-compose-{{ inventory_hostname }}.yml.j2"
        dest: /home/bigchacha/docker-compose.yml
        owner: bigchacha
        group: bigchacha
        mode: '0644'

    - name: Copy .env file
      ansible.builtin.copy:
        src: "files/env/{{ inventory_hostname }}.env"
        dest: /home/bigchacha/.env
        owner: bigchacha
        group: bigchacha
        mode: "0600"

    - name: Copy cc-it-solutions site files
      ansible.builtin.copy:
        src: files/websites/cc-it-solutions/
        dest: /home/bigchacha/cc-it-solutions/
        owner: bigchacha
        group: bigchacha
        mode: '0644'
      when: inventory_hostname == "websites"

    - name: Copy portfolio site files
      ansible.builtin.copy:
        src: files/websites/portfolio/
        dest: /home/bigchacha/portfolio/
        owner: bigchacha
        group: bigchacha
        mode: '0644'
      when: inventory_hostname == "websites"

- name: Add user to docker group
  hosts: all
  become: true
  tasks:
    - name: Add bigchacha to docker group
      ansible.builtin.user:
        name: bigchacha
        groups: docker
        append: true

- name: Increase UDP buffer
  hosts: websites, monitoring
  become: true
  tasks:
    - name: Set UDP buffer sizes for cloudflared
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_set: true
      loop:
        - name: net.core.rmem_max
          value: "7340032"
        - name: net.core.wmem_max
          value: "7340032"

- name: Execute docker compose up
  hosts: all
  become: true
  tasks:
    - name: Check if Docker is running
      ansible.builtin.service_facts:
      register: service_state

    - name: Verify Docker service is running
      ansible.builtin.assert:
        that:
          - "'docker.service' in service_state.ansible_facts.services"
          - "service_state.ansible_facts.services['docker.service'].state == 'running'"

    - name: Execute docker-compose up
      community.docker.docker_compose_v2:
        project_src: /home/bigchacha
        files:
          - docker-compose.yml

- name: Harden SSH
  hosts: all
  become: true
  tasks:
    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Disable challenge-response authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: 'KbdInteractiveAuthentication no'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Disable direct root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
